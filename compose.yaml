services:
  ventascontrol:
    build: .
    container_name: ventascontrol
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:8000"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
